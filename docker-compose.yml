version: "3.8"

services:
  sam3d:
    build: .
    ports:
      - "8000:8000"
    environment:
      SAM3D_CHECKPOINT_DIR: ${SAM3D_CHECKPOINT_DIR}
      SAM3D_CHECKPOINT_FILE: ${SAM3D_CHECKPOINT_FILE:-model.ckpt}
      SAM3D_FOV_PATH: /app/moge-2-vitl-normal/model.pt
    volumes:
      - ${SAM3D_CHECKPOINT_DIR}:${SAM3D_CHECKPOINT_DIR}:ro
      - ../moge-2-vitl-normal:/app/moge-2-vitl-normal:ro
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
